<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小敬的随笔 · 写作空间</title>
  <style>
    :root {
      --bg: #f9f8f5;
      --card: #ffffff;
      --text: #2c3437;
      --sub: #787f85;
      --border: #e6e4df;
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    }
    [data-theme="dark"] {
      --bg: #18191a;
      --card: #242526;
      --text: #e4e6eb;
      --sub: #b0b3b8;
      --border: #3a3b3c;
    }
    [data-font="serif"] {
      --font: "Songti SC", "Noto Serif SC", STSong, Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.85;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, color 0.2s;
      -webkit-font-smoothing: antialiased;
    }
    header {
      border-bottom: 1px solid var(--border);
      background: var(--card);
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 20px;
    }
    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(46, 204, 113, 0.15);
      color: #27ae60;
      font-weight: 500;
      transition: all 0.2s;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button.btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    button.btn:hover { border-color: var(--sub); }
    button.btn-primary {
      background: #2c3437;
      color: #fff;
      border-color: #2c3437;
    }
    [data-theme="dark"] button.btn-primary {
      background: #3a3b3c;
      color: #fff;
      border-color: #555;
    }
    .container {
      max-width: 820px;
      margin: 24px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }
    .editor-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 36px 32px;
      min-height: 600px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      color: var(--sub);
      font-size: 0.85rem;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border);
    }
    .title-input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      margin-bottom: 16px;
      font-family: inherit;
      line-height: 1.4;
    }
    .title-input::placeholder { color: var(--sub); opacity: 0.5; }
    .content-area {
      width: 100%;
      min-height: 480px;
      border: none;
      outline: none;
      font-size: 1.1rem;
      color: var(--text);
      background: transparent;
      font-family: inherit;
      line-height: 2;
      resize: vertical;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .content-area::placeholder { color: var(--sub); opacity: 0.5; }
    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      z-index: 30;
      display: none;
      backdrop-filter: blur(2px);
    }
    .drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 300px;
      max-width: 80vw;
      background: var(--card);
      border-right: 1px solid var(--border);
      z-index: 31;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .drawer-list { list-style: none; overflow-y: auto; flex: 1; }
    .drawer-item {
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .drawer-item:hover { background: rgba(0,0,0,0.03); }
    .drawer-item.active {
      background: rgba(0,0,0,0.06);
      border-color: var(--border);
      font-weight: 500;
    }
    .drawer-item-title {
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .drawer-item-date { font-size: 0.75rem; color: var(--sub); }
    footer {
      text-align: center;
      padding: 24px 20px;
      color: var(--sub);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    @media (max-width: 640px) {
      .editor-card { padding: 24px 18px; }
      .title-input { font-size: 1.4rem; }
      .content-area { font-size: 1rem; }
      .header-inner { flex-direction: column; align-items: stretch; }
      .toolbar { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <span>随笔归档</span>
      <button class="btn" onclick="toggleDrawer(false)">✕</button>
    </div>
    <ul class="drawer-list" id="drawerList"></ul>
    <div style="margin-top: 12px; display: flex; gap: 8px;">
      <button class="btn btn-primary" style="flex: 1;" onclick="createNewEssay()">+ 新建一篇</button>
    </div>
  </aside>

  <header>
    <div class="header-inner">
      <div class="brand-title">
        <button class="btn" onclick="toggleDrawer(true)">📑 随笔目录</button>
        <span>小敬的随笔</span>
        <span class="badge" id="saveBadge">✓ 已就绪</span>
      </div>
      <div class="toolbar">
        <button class="btn" onclick="toggleFont()" id="fontBtn">字体: 宋体</button>
        <button class="btn" onclick="toggleTheme()" id="themeBtn">🌓 外观</button>
        <button class="btn" onclick="copyContent()">📋 复制全文</button>
        <button class="btn" onclick="exportMarkdown()">📥 导出</button>
      </div>
    </div>
  </header>

  <main class="container">
    <article class="editor-card">
      <div class="meta-bar">
        <span id="updateTime">上次保存：刚刚</span>
        <span id="wordCount">字数：0</span>
      </div>
      <input type="text" class="title-input" id="titleInput" placeholder="输入随笔标题…" />
      <textarea class="content-area" id="contentInput" placeholder="在此写下你的文字、阅读思考或灵感碎片…（内容会自动实时保存在当前设备浏览器本地）"></textarea>
    </article>
  </main>

  <footer>
    <p>托管于 GitHub Pages · 本地实时存储 · 随时可在手机与电脑端编辑</p>
  </footer>

  <script>
    const STORAGE_KEY = 'xiaojing_essays_v1';
    const ACTIVE_KEY = 'xiaojing_active_id';
    let essays = [];
    let currentId = null;

    function init() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) essays = JSON.parse(raw);
      } catch (e) { console.error(e); }

      if (!essays || essays.length === 0) {
        essays = [
          {
            id: 'default-1',
            title: '鱼缸与荒谬感',
            content: '世界荒谬而真实，文字是给生活留的一扇窗。\n\n在日常的秩序与群体的热闹里，人往往像隔着一层玻璃看游动的鱼，既在其中，又在事外。记录本身不是为了消解这种荒诞，而是确认自我的真实存在。',
            updatedAt: new Date().toISOString()
          }
        ];
        saveToStorage();
      }

      currentId = localStorage.getItem(ACTIVE_KEY) || essays[0].id;
      if (!essays.find(e => e.id === currentId)) currentId = essays[0].id;

      loadEssay(currentId);
      renderDrawer();

      if (localStorage.getItem('theme_pref') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      if (localStorage.getItem('font_pref') === 'serif') document.documentElement.setAttribute('data-font', 'serif');
      updateButtonLabels();

      document.getElementById('titleInput').addEventListener('input', onInputChange);
      document.getElementById('contentInput').addEventListener('input', onInputChange);
    }

    function loadEssay(id) {
      const essay = essays.find(e => e.id === id);
      if (!essay) return;
      currentId = id;
      localStorage.setItem(ACTIVE_KEY, id);
      document.getElementById('titleInput').value = essay.title || '';
      document.getElementById('contentInput').value = essay.content || '';
      updateMeta(essay.updatedAt, essay.content);
      renderDrawer();
    }

    function onInputChange() {
      const badge = document.getElementById('saveBadge');
      badge.textContent = '● 正在保存…';
      badge.style.background = 'rgba(241, 196, 15, 0.2)';
      badge.style.color = '#d35400';

      const essay = essays.find(e => e.id === currentId);
      if (essay) {
        essay.title = document.getElementById('titleInput').value;
        essay.content = document.getElementById('contentInput').value;
        essay.updatedAt = new Date().toISOString();
        saveToStorage();
        updateMeta(essay.updatedAt, essay.content);
      }

      setTimeout(() => {
        badge.textContent = '✓ 已自动保存';
        badge.style.background = 'rgba(46, 204, 113, 0.15)';
        badge.style.color = '#27ae60';
      }, 300);
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(essays));
    }

    function updateMeta(updatedAt, content) {
      const timeStr = updatedAt ? new Date(updatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '刚刚';
      document.getElementById('updateTime').textContent = '上次保存：' + timeStr;
      const count = (content || '').replace(/\s/g, '').length;
      document.getElementById('wordCount').textContent = '字数：' + count;
    }

    function createNewEssay() {
      const newEssay = {
        id: 'essay-' + Date.now(),
        title: '',
        content: '',
        updatedAt: new Date().toISOString()
      };
      essays.unshift(newEssay);
      saveToStorage();
      loadEssay(newEssay.id);
      toggleDrawer(false);
      document.getElementById('titleInput').focus();
    }

    function toggleDrawer(show) {
      document.getElementById('drawer').classList.toggle('open', show);
      document.getElementById('drawerOverlay').style.display = show ? 'block' : 'none';
    }

    function renderDrawer() {
      const list = document.getElementById('drawerList');
      list.innerHTML = '';
      essays.forEach(item => {
        const li = document.createElement('li');
        li.className = 'drawer-item' + (item.id === currentId ? ' active' : '');
        const titleSpan = document.createElement('span');
        titleSpan.className = 'drawer-item-title';
        titleSpan.textContent = item.title.trim() || '（无标题随笔）';
        const dateSpan = document.createElement('span');
        dateSpan.className = 'drawer-item-date';
        dateSpan.textContent = new Date(item.updatedAt).toLocaleDateString('zh-CN');
        li.appendChild(titleSpan);
        li.appendChild(dateSpan);
        li.onclick = () => { loadEssay(item.id); toggleDrawer(false); };
        list.appendChild(li);
      });
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.toggleAttribute('data-theme', !isDark);
      localStorage.setItem('theme_pref', !isDark ? 'dark' : 'light');
      updateButtonLabels();
    }

    function toggleFont() {
      const isSerif = document.documentElement.getAttribute('data-font') === 'serif';
      document.documentElement.toggleAttribute('data-font', !isSerif);
      localStorage.setItem('font_pref', !isSerif ? 'serif' : 'sans');
      updateButtonLabels();
    }

    function updateButtonLabels() {
      const isSerif = document.documentElement.getAttribute('data-font') === 'serif';
      document.getElementById('fontBtn').textContent = isSerif ? '字体: 宋体/衬线' : '字体: 系统黑体';
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.getElementById('themeBtn').textContent = isDark ? '☀️ 日间模式' : '🌙 夜间模式';
    }

    function copyContent() {
      const title = document.getElementById('titleInput').value;
      const content = document.getElementById('contentInput').value;
      const fullText = (title ? '# ' + title + '\n\n' : '') + content;
      navigator.clipboard.writeText(fullText).then(() => {
        const badge = document.getElementById('saveBadge');
        const oldText = badge.textContent;
        badge.textContent = '✓ 已复制到剪贴板';
        setTimeout(() => badge.textContent = oldText, 1500);
      });
    }

    function exportMarkdown() {
      const title = document.getElementById('titleInput').value || '随笔';
      const content = document.getElementById('contentInput').value;
      const fullText = '# ' + title + '\n\n' + content;
      const blob = new Blob([fullText], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = title + '.md';
      a.click();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

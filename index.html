<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小敬的随笔</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      line-height: 1.8;
      color: #2c3e50;
      max-width: 680px;
      margin: 60px auto;
      padding: 0 20px;
      background-color: #faf9f6;
    }
    h1 { font-weight: 500; font-size: 1.8rem; margin-bottom: 0.5rem; color: #1a252f; }
    p.intro { color: #7f8c8d; font-size: 0.95rem; margin-bottom: 2rem; }
    .card { background: #fff; border: 1px solid #e8e6e1; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .card p { margin: 0; color: #34495e; font-size: 1.05rem; }
    footer { margin-top: 3rem; font-size: 0.85rem; color: #bdc3c7; text-align: center; }
  </style>
</head>
<body>
  <h1>小敬的随笔</h1>
  <p class="intro">一些文字、思考与记录</p>
  <div class="card">
    <p>世界荒诞而真实，文字是给生活留的一扇窗。随笔小站正在搭建中……</p>
  </div>
  <footer>Powered by GitHub Pages</footer>
</body>
</html>
